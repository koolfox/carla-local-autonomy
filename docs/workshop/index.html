  <link rel="stylesheet" href="assets/presentation.css?v=20261107-adas2">

<body>
  <header class="deck-toolbar">
    <a id="notebook-link" href="docs/class-presentation.fa.md">متن کارگاه</a>
    <div><a id="sources-link" href="#slide-14">منابع</a><button id="print-slides" type="button" disabled>چاپ / PDF</button><button id="fullscreen" type="button">تمام‌صفحه</button></div>
  </header>
  <main id="deck" aria-label="ارائهٔ کارگاه CARLA Vision" tabindex="-1" aria-busy="true"></main>
  <p id="deck-status" role="status">در حال آماده‌سازی اسلایدها…</p>
  <button id="retry-deck" type="button" hidden>بارگذاری دوباره</button>

    <header class="media-dialog-header"><h2 id="slide-media-title">نمای بزرگ شکل</h2><button id="close-slide-media" type="button">بستن و بازگشت به اسلاید</button></header>

    <p id="slide-media-caption"></p>
  </dialog>
  <noscript><p>برای نمایش اسلایدها JavaScript را فعال کنید یا <a href="docs/class-presentation.fa.md">متن ارائه را بخوانید</a>.</p></noscript>
  <footer class="deck-controls" aria-label="کنترل اسلایدها">
    <button id="slide-prev" type="button" disabled>قبلی</button>
    <label for="slide-select" class="visually-hidden">انتخاب اسلاید</label>
    <select id="slide-select" disabled><option>اسلایدها</option></select>
    <span id="slide-progress" aria-live="polite"></span>
    <button id="slide-next" type="button" disabled>بعدی</button>
  </footer>
