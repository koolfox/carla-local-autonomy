[project]
name = "carla-vision-research"
version = "0.9.0"
description = "A model-neutral, artifact-first CARLA monocular-vision research framework."
requires-python = ">=3.11,<3.14"
dependencies = [
  "msgpack>=1.1",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "psutil>=5.9",
]

[project.optional-dependencies]
launcher = [
  "textual==8.2.8",
  "imageio-ffmpeg==0.6.0",
]
native-host = [
  "carla==0.9.16; python_version < '3.13' and (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "networkx>=3.2",
  "shapely>=2.0",
]
deit64 = [
  "torch>=2.6",
  "timm>=1.0,<2",
  "pillow>=10",
]
m9 = [
  "torch>=2.6",
  "ultralytics==8.4.137",
  "pillow>=10",
]
vision = [
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.4",
]
segmentation = [
  "onnxruntime>=1.20,<2",
  "torch>=2.4",
  "transformers>=4.45,<6",
  "safetensors>=0.4",
]
research = [
  "matplotlib>=3.9",
  "pycocotools>=2.0.10",
  "torch>=2.4",
  "ultralytics>=8.4",
]
experimental = [
  "torch>=2.4",
]
voxel = [
  "torch>=2.4",
  "transformers>=4.45,<6",
  "safetensors>=0.4",
]

[project.scripts]
carla-train-imitation = "carla_vision.imitation.runner:main"
carla-verify-consumption = "carla_vision.reproduction.consumption_verify:main"
carla-test-execution = "carla_vision.reproduction.test_execution:main"
carla-pool-evaluations = "carla_vision.evaluation.pool:main"
carla-replay-bundled-metrics = "carla_vision.reproduction.replay_metrics:main"
carla-reviewer-evidence = "carla_vision.reproduction.reviewer:main"
carla-source-snapshot = "carla_vision.reproduction.source_snapshot:main"
carla-audit-trajectories = "carla_vision.dataset.trajectory_audit:main"
carla-verify-shards = "carla_vision.dataset.shards:main"
carla-select-coreset = "carla_vision.scenarios.baselines:main"
carla-score-diagnosis = "carla_vision.failure_mining.diagnosis_benchmark:main"
carla-analyze-study-seeds = "carla_vision.evaluation.study_statistics:main"
carla-check-research-claims = "carla_vision.scenarios.claims:main"
carla-prepare-acquisition-pool = "carla_vision.failure_mining.acquisition_pool:main"
carla-plan-acquisition-study = "carla_vision.scenarios.study:main"
carla-derive-training-dataset = "carla_vision.dataset.derivation:main"
carla-evaluate-imitation = "carla_vision.imitation.evaluate:main"
carla-app = "carla_vision.launcher.cli:main"
carla-build-installer = "carla_vision.launcher.bundle:main"
carla-vision = "carla_vision.runtime:main"
carla-analyze-run = "carla_vision.analysis:main"
carla-build-evidence-index = "carla_vision.evidence.builder:main"
carla-collect-dataset = "carla_vision.dataset.collector:main"
carla-audit-dataset = "carla_vision.dataset.qa:main"
carla-plan-scenarios = "carla_vision.scenarios.planner:main"
carla-native-preflight = "carla_vision.native.preflight:main"
carla-native-collect = "carla_vision.native.worker:main"
carla-world-worker = "carla_vision.native.observable_world_worker:main"
carla-garage-acceptance = "carla_vision.operator.garage_acceptance:main"
carla-model-acceptance = "carla_vision.operator.model_acceptance:main"
carla-garage-density-acceptance = "carla_vision.operator.garage_density_acceptance:main"
carla-record-behavior-teacher = "carla_vision.native.behavior_teacher:main"
carla-verify-teacher-episodes = "carla_vision.native.teacher_verify:main"
carla-replay-teacher-episode = "carla_vision.dataset.episode_replay:main"
carla-build-native-task = "carla_vision.native.task_package:main"
carla-native-jobs = "carla_vision.operator.native_research:main"
carla-compare-teacher-episodes = "carla_vision.native.teacher_compare:main"
carla-build-native-kit = "carla_vision.native.host_kit:main"
carla-verify-native-kit = "carla_vision.native.verified_host_kit:main"
carla-train-detector = "carla_vision.training.runner:main"
carla-evaluate-detector = "carla_vision.evaluation.runner:main"
carla-replay-models = "carla_vision.replay.runner:main"
carla-select-threshold = "carla_vision.thresholds.selector:main"
carla-mine-failures = "carla_vision.failure_mining.miner:main"
carla-finalize-failure-review = "carla_vision.failure_mining.review:main"
carla-verify = "carla_vision.verification:main"
carla-package-model = "carla_vision.model_release.package:main"
carla-build-report = "carla_vision.reporting.builder:main"
carla-build-reproduction = "carla_vision.reproduction.builder:main"
carla-verify-reproduction = "carla_vision.reproduction.verified:main"
carla-verify-shadow = "carla_vision.policy.verified:main"
carla-shadow-matrix = "carla_vision.shadow.matrix:main"
carla-verify-shadow-matrix = "carla_vision.shadow.verified:main"
carla-operator-ui = "carla_vision.operator.product_console:main"
carla-discover = "carla_vision.discovery:main"
carla-remote = "carla_vision.remote:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carla_vision"]

[tool.ruff]
line-length = 100
extend-exclude = ["carla_vision/_vendor"]

[tool.ruff.lint]
# Pin the baseline so upgrades do not silently enable a different policy.
select = ["E4", "E7", "E9", "F", "I", "B"]
