name: Ruff import diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --group dev --frozen
      - name: Print import fixes
        run: uv run ruff check --select I --diff carla_vision/native/observable_world_worker.py carla_vision/operator/garage_async.py
