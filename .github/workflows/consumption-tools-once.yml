name: Inspect locked trainer source once
on:
  push:
    branches: ['codex/144-consumed-sample-evidence']
    paths: ['.github/workflows/consumption-tools-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download only checksum-locked offline trainer dependencies
        run: |
          python - <<'PY'
          import hashlib, pathlib, tomllib, urllib.request
          lock=tomllib.loads(pathlib.Path('uv.lock').read_text())
          root=pathlib.Path('/tmp/consumption-tools'); root.mkdir()
          records=[]
          for name in ('ultralytics','polars','polars-runtime-32'):
              package=next(p for p in lock['package'] if p['name']==name)
              wheel=next(w for w in package['wheels'] if w['url'].endswith('none-any.whl') or ('manylinux' in w['url'] and 'x86_64' in w['url']))
              data=urllib.request.urlopen(wheel['url'],timeout=90).read()
              assert hashlib.sha256(data).hexdigest()==wheel['hash'].split(':')[1]
              target=pathlib.PurePosixPath(wheel['url']).name
              (root/target).write_bytes(data)
              records.append(wheel['hash']+'  '+target)
          (root/'SHA256.txt').write_text('\n'.join(records)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: locked-trainer-consumption-source
          path: /tmp/consumption-tools/
          retention-days: 7
          if-no-files-found: error
