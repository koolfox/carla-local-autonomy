name: Inspect locked trainer source once
on:
  push:
    branches: ['codex/144-consumed-sample-evidence']
    paths: ['.github/workflows/consumption-tools-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download locked wheel for source inspection only
        run: |
          python - <<'PY'
          import hashlib, pathlib, tomllib, urllib.request
          lock=tomllib.loads(pathlib.Path('uv.lock').read_text())
          package=next(p for p in lock['package'] if p['name']=='ultralytics')
          wheel=package['wheels'][0]
          root=pathlib.Path('/tmp/consumption-tools'); root.mkdir()
          data=urllib.request.urlopen(wheel['url'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()==wheel['hash'].split(':')[1]
          (root/pathlib.PurePosixPath(wheel['url']).name).write_bytes(data)
          (root/'SHA256.txt').write_text(wheel['hash']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: locked-trainer-consumption-source
          path: /tmp/consumption-tools/
          retention-days: 7
          if-no-files-found: error
