name: Validate pinned Ultralytics consumption source once
on:
  push:
    branches: ['codex/144-ultralytics-consumption']
    paths:
      - '.github/workflows/ultralytics-apply-once.yml'
      - '.github/ultralytics_transport/**'
permissions:
  contents: write
concurrency:
  group: reviewed-ultralytics-consumption
  cancel-in-progress: false
jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Validate checksum-bound source and allowed paths
        shell: bash
        run: |
          mkdir -p /tmp/ultralytics-evidence
          git rev-parse HEAD > /tmp/ultralytics-evidence/base-head.txt
          git merge-base --is-ancestor c2d0f02f9bff30ff26f11ca1afa5eb714e59e592 HEAD
          git diff --exit-code c2d0f02f9bff30ff26f11ca1afa5eb714e59e592 HEAD -- carla_vision tests docs pyproject.toml uv.lock
          python - <<'PY'
          import base64, bz2, hashlib, json, subprocess
          from pathlib import Path
          root = Path('.github/ultralytics_transport')
          encoded = ''.join((root / f'payload.{i:02}').read_text(encoding='ascii') for i in range(2))
          if len(encoded) != 22060:
              raise SystemExit('transport length mismatch')
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != '0d06f61ff7823d3baf541af3b0be4cc195f8c0e99e8596259481442c83109a1d':
              raise SystemExit('compressed checksum mismatch; no source applied')
          patch = bz2.decompress(compressed)
          if len(patch) != 67365 or hashlib.sha256(patch).hexdigest() != '28d2199fb62881a98403eb0fc4b832105617ad4d796e7c63445d49cf5d6e9294':
              raise SystemExit('reviewed source checksum mismatch; no source applied')
          path = Path('/tmp/ultralytics-evidence/source.patch')
          path.write_bytes(patch)
          expected = {
              'carla_vision/reproduction/consumption.py',
              'carla_vision/training/backends.py',
              'carla_vision/training/runner.py',
              'carla_vision/training/ultralytics_consumption.py',
              'docs/README.md',
              'docs/adr/0005-pinned-ultralytics-consumption.md',
              'docs/reviewer_evidence.md',
              'tests/test_consumed_samples.py',
              'tests/test_ultralytics_consumption.py',
          }
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True).splitlines()
          names = [line.split('\t', 2)[2] for line in stats]
          if len(names) != 9 or set(names) != expected or any(line.startswith('-') for line in stats):
              raise SystemExit('unexpected reviewed file set')
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(expected)}
          Path('/tmp/ultralytics-evidence/file-sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.13.1'
      - name: Install locked profiles and offline recording encoder
        run: |
          uv sync --all-extras --all-groups --frozen
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint and whitespace
        run: |
          uv run ruff check carla_vision tests restore_project.py
          git diff --cached --check
      - name: Run complete suite including actual tiny YOLO and RT-DETR training
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --junitxml=/tmp/ultralytics-evidence/tests.xml 2>&1 | tee /tmp/ultralytics-evidence/pytest.log
      - name: Publish tested source to this feature branch only
        env:
          REVIEW_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          branch = 'codex/144-ultralytics-consumption'
          if os.environ['GITHUB_REF'] != f'refs/heads/{branch}':
              raise SystemExit('unexpected branch')
          token = os.environ.pop('REVIEW_PUSH_TOKEN')
          header = 'AUTHORIZATION: basic ' + base64.b64encode(f'x-access-token:{token}'.encode()).decode()
          auth = ['git', '-c', f'http.https://github.com/.extraheader={header}']
          remote = subprocess.check_output(auth + ['ls-remote', 'origin', f'refs/heads/{branch}'], text=True).split()[0]
          if remote != os.environ['GITHUB_SHA']:
              raise SystemExit('branch moved; refusing publication')
          env = dict(os.environ, GIT_AUTHOR_NAME='Codex', GIT_AUTHOR_EMAIL='codex@openai.com', GIT_COMMITTER_NAME='Hesam Shani', GIT_COMMITTER_EMAIL='50404883+koolfox@users.noreply.github.com')
          message = 'feat(training): attest actual pinned Ultralytics batch consumption\n\nAdvance S2 of #144 on #146. Instrument real YOLO and RT-DETR training and validation with fixed-pass evidence, source-safe loading and final selected-weight validation. Tiny CPU fixtures establish software behavior, not ADAS quality or Q1 acceptance.\n\nCo-authored-by: Hesam Sheini <50404883+koolfox@users.noreply.github.com>'
          subprocess.run(['git', 'commit', '-m', message], env=env, check=True)
          subprocess.run(auth + ['push', 'origin', f'HEAD:refs/heads/{branch}'], check=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True)
          Path('/tmp/ultralytics-evidence/published-commit.txt').write_text(sha)
          print('Published tested source:', sha.strip())
          PY
      - name: Retain source and test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultralytics-consumption-source-tests-${{ github.sha }}
          path: /tmp/ultralytics-evidence
          retention-days: 14
          if-no-files-found: error
