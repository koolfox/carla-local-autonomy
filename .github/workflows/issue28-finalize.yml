name: Issue 28 acceptance finalize

on:
  push:
    branches: [issue/28-world-route-truth]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue/28-world-route-truth
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Narrow fake-worker capability patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/issue28_acceptance_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              test_path,
              '            "capabilities": {"camera_pause_resume": True},',
              '            "capabilities": {\\n                "camera_pause_resume": True,\\n                "spawn_point_selection": True,\\n                "selected_route": True,\\n            },',
          )'''
          new = '''replace_once(
              test_path,
              '            "capabilities": {"camera_pause_resume": True},\\n        }\\n\\n    def current_scene(self) -> dict[str, Any]:',
              '            "capabilities": {\\n                "camera_pause_resume": True,\\n                "spawn_point_selection": True,\\n                "selected_route": True,\\n            },\\n        }\\n\\n    def current_scene(self) -> dict[str, Any]:',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one capability patch block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply live acceptance wiring
        run: python tools/issue28_acceptance_patch.py
      - name: Install Python dependencies
        run: uv sync --group dev --frozen
      - name: Validate issue 28 contracts
        run: |
          uv run ruff check carla_vision tests
          uv run pytest -q \
            tests/test_garage_acceptance.py \
            tests/test_garage_route_policy.py \
            tests/test_garage_world_route_ui.py \
            tests/test_garage_drive.py \
            tests/test_operator_configuration.py \
            tests/test_world_worker.py \
            tests/test_world_worker_client.py
          uv run carla-garage-acceptance --help
      - name: Commit validated acceptance wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add carla_vision tests
          git diff --cached --quiet && exit 0
          git commit -m "Add live Garage route-selection acceptance evidence"
          git push origin HEAD:issue/28-world-route-truth
