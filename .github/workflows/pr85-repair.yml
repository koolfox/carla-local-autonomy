name: Repair PR 85

on:
  push:
    branches: [codex/voxel-waypoint-overlay]

permissions:
  contents: write

concurrency:
  group: pr85-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/voxel-waypoint-overlay
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Apply reviewed repair
        run: python .github/pr85_repair.py

      - name: Validate and rebuild Svelte console
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build

      - name: Validate Python and integration tests
        run: |
          uv sync --group dev --frozen
          uv run ruff check carla_vision tests
          uv run pytest -q \
            tests/test_voxel_live_view.py \
            tests/test_voxel_ui_contract.py \
            tests/test_waypoint_teacher_worker.py \
            tests/test_world_worker.py \
            tests/test_world_worker_client.py \
            tests/test_drive_console.py

      - name: Commit repaired PR branch
        run: |
          rm -f .github/workflows/pr85-repair.yml .github/pr85_repair.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix waypoint overlay integration and concurrency"
          git push origin HEAD:codex/voxel-waypoint-overlay
