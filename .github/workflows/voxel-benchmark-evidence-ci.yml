name: Voxel benchmark evidence CI

on:
  pull_request:
    paths:
      - "carla_vision/voxel/benchmark.py"
      - "carla_vision/voxel/evidence_builder.py"
      - "tests/test_voxel_benchmark.py"
      - "tests/test_voxel_evidence_builder.py"
      - "docs/voxel_benchmark_evidence_fa.md"
      - "pyproject.toml"
      - ".github/workflows/voxel-benchmark-evidence-ci.yml"
  push:
    branches: [main]
    paths:
      - "carla_vision/voxel/benchmark.py"
      - "carla_vision/voxel/evidence_builder.py"
      - "tests/test_voxel_benchmark.py"
      - "tests/test_voxel_evidence_builder.py"
      - "pyproject.toml"
      - ".github/workflows/voxel-benchmark-evidence-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-groups --frozen

      - name: Lint voxel benchmark and evidence
        run: >-
          uv run ruff check
          carla_vision/voxel/benchmark.py
          carla_vision/voxel/evidence_builder.py
          tests/test_voxel_benchmark.py
          tests/test_voxel_evidence_builder.py

      - name: Run voxel benchmark and evidence tests
        run: >-
          uv run pytest -q
          tests/test_voxel_benchmark.py
          tests/test_voxel_evidence_builder.py

      - name: Check benchmark CLI
        run: uv run carla-benchmark-voxel --help

      - name: Check evidence builder CLI
        run: uv run carla-build-voxel-readiness-evidence --help
