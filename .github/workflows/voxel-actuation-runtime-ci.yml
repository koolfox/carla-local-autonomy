name: Voxel actuation runtime CI

on:
  pull_request:
    paths:
      - "carla_vision/voxel/actuation_runtime.py"
      - "carla_vision/voxel/local_drive_actuation.py"
      - "tests/test_voxel_actuation_runtime.py"
      - "tests/test_voxel_local_drive_actuation.py"
      - "docs/voxel_actuation_fa.md"
      - "pyproject.toml"
      - ".github/workflows/voxel-actuation-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "carla_vision/voxel/actuation_runtime.py"
      - "carla_vision/voxel/local_drive_actuation.py"
      - "tests/test_voxel_actuation_runtime.py"
      - "tests/test_voxel_local_drive_actuation.py"
      - "docs/voxel_actuation_fa.md"
      - "pyproject.toml"
      - ".github/workflows/voxel-actuation-runtime-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-groups --frozen

      - name: Lint voxel actuation runtime
        run: >-
          uv run ruff check
          carla_vision/voxel/actuation_runtime.py
          carla_vision/voxel/local_drive_actuation.py
          tests/test_voxel_actuation_runtime.py
          tests/test_voxel_local_drive_actuation.py

      - name: Run voxel actuation runtime tests
        run: >-
          uv run pytest -q
          tests/test_voxel_actuation_runtime.py
          tests/test_voxel_local_drive_actuation.py
          tests/test_voxel_actuation_supervisor.py
          tests/test_local_drive.py

      - name: Check normal local drive delegation
        run: uv run carla-local-drive --dry-run --vehicles 1 --walkers 0

      - name: Check opt-in voxel dry run
        run: >-
          uv run carla-local-drive --dry-run --vehicles 1 --walkers 0
          --enable-voxel-actuation --acknowledge-voxel-actuation
          --voxel-predictor-factory example.module:create_predictor
