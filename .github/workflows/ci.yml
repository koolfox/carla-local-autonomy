name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Operator core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install lean operator profile
        run: uv sync --group dev --frozen

      - name: Install browser recording encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint source and tests
        run: uv run ruff check carla_vision tests

      - name: Check browser JavaScript syntax
        run: node --check carla_vision/operator/static/app.js

      - name: Run operator regression tests
        run: >-
          uv run pytest -q
          tests/test_bridge.py
          tests/test_browser_video.py
          tests/test_camera_pause_acceptance.py
          tests/test_camera_relay_teardown.py
          tests/test_discovery.py
          tests/test_drive_console.py
          tests/test_external_model_drive.py
          tests/test_garage_acceptance.py
          tests/test_garage_capture.py
          tests/test_garage_density_acceptance.py
          tests/test_garage_async.py
          tests/test_garage_camera_fit.py
          tests/test_garage_drive.py
          tests/test_garage_preview.py
          tests/test_garage_preview_quality.py
          tests/test_garage_reconfigure.py
          tests/test_garage_research.py
          tests/test_garage_research_bridge.py
          tests/test_garage_route_policy.py
          tests/test_garage_scene_handoff.py
          tests/test_garage_visual_contract.py
          tests/test_garage_world_route_ui.py
          tests/test_model_registry.py
          tests/test_multicamera_dataset.py
          tests/test_multicamera_teacher.py
          tests/test_native_research_jobs.py
          tests/test_observable_world_worker.py
          tests/test_prepare_cancellation.py
          tests/test_operator.py
          tests/test_operator_artifacts.py
          tests/test_operator_configuration.py
          tests/test_operator_local_config.py
          tests/test_product_console.py
          tests/test_recording.py
          tests/test_runtime.py
          tests/test_voxel_rgb_depth.py
          tests/test_voxel_live_view.py
          tests/test_voxel_ui_contract.py
          tests/test_standalone_world_bridge.py
          tests/test_world_worker.py
          tests/test_world_worker_population.py
          tests/test_world_worker_spawn_failures.py
          tests/test_world_worker_client.py
          tests/test_world_worker_reconfigure.py
          tests/test_world_worker_stream_lifecycle.py
          tests/test_world_worker_ui.py

      - name: Check production entry points
        run: |
          uv run carla-world-worker --help
          uv run carla-operator-ui --help
          uv run carla-discover --help
          uv run carla-garage-acceptance --help
          uv run carla-garage-density-acceptance --help
          uv run carla-vision --help
          uv run carla-native-jobs --help
          uv run carla-build-native-task --help

      - name: Verify wheel contains the product console
        run: |
          uv build --wheel
          python -m zipfile -l dist/*.whl | grep -F carla_vision/operator/console_static/index.html
          python -m zipfile -l dist/*.whl | grep -F carla_vision/operator/console_static/_app/immutable/

  frontend:
    name: SvelteKit console
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type-check Svelte console
        working-directory: web
        run: npm run check

      - name: Test Garage live settings queue
        working-directory: web
        run: npm test

      - name: Build static console
        working-directory: web
        run: npm run build

      - name: Verify deployable console is current
        run: |
          git status --porcelain --untracked-files=all -- carla_vision/operator/console_static > console-status.txt
          test ! -s console-status.txt

      - name: Upload deployable Garage console
        uses: actions/upload-artifact@v4
        with:
          name: garage-console-static
          path: carla_vision/operator/console_static
          if-no-files-found: error
          retention-days: 7

  full-suite:
    name: Research and experimental suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install every supported profile
        run: uv sync --all-extras --all-groups --frozen

      - name: Install browser recording encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run complete test suite
        run: uv run pytest -q
