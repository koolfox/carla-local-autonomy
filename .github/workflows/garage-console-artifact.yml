name: Garage console artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-garage-console
          path: carla_vision/operator/console_static
          if-no-files-found: error
          retention-days: 1
