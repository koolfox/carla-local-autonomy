name: Offline research evidence

on:
  pull_request:
    paths:
      - 'carla_vision/**'
      - 'tests/**'
      - 'configs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/research-offline.yml'
  push:
    branches: ['codex/research-validity-offline', 'codex/reviewer-evidence-kit']
  workflow_dispatch:

env:
  OMP_NUM_THREADS: 2
  MKL_NUM_THREADS: 2

permissions:
  contents: read

concurrency:
  group: research-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - name: Archive tracked research source, excluding model and sample payloads
        shell: bash
        run: |
          mkdir -p /tmp/carlapyvision-source
          git archive --format=tar.gz -o /tmp/carlapyvision-source/source.tar.gz HEAD -- carla_vision tests configs docs web .github .agents pyproject.toml uv.lock restore_project.py AGENTS.md CONTRIBUTING.md PRODUCT.md README.md README.fa.md CITATION.cff .gitignore .gitattributes
          git rev-parse HEAD > /tmp/carlapyvision-source/commit.txt
          printf '%s\n' 'Source-only archive; model weights, historical samples and runtime data excluded. Obtain those separately before full recovery acceptance.' > /tmp/carlapyvision-source/SCOPE.txt
          cd /tmp/carlapyvision-source && sha256sum source.tar.gz > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: research-source-${{ github.sha }}
          path: /tmp/carlapyvision-source/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install locked research and test dependencies
        run: uv sync --all-extras --all-groups --frozen
      - name: Install recording encoder for offline tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint
        run: uv run ruff check carla_vision tests restore_project.py
      - name: Run offline regression suite
        run: |
          uv run python -m carla_vision.reproduction.test_evidence --output /tmp/consumption-ci
          cp /tmp/consumption-ci/tests.xml /tmp/research-tests.xml
      - name: Build and verify commit-bound reviewer source
        run: |
          mkdir -p /tmp/reviewer-evidence
          uv run carla-source-snapshot --repository . --commit HEAD --output /tmp/reviewer-evidence/source-review.zip > /tmp/reviewer-evidence/source.json
          uv run python - <<'PYCODE'
          import json
          from pathlib import Path
          from carla_vision.reproduction.reviewer import _source_archive
          record = json.loads(Path('/tmp/reviewer-evidence/source.json').read_text())
          _source_archive(Path(record['archive']['path']), record['source_commit'])
          PYCODE
      - name: Reviewer entry points and honest missing-evidence gate
        run: |
          uv run carla-reviewer-evidence --help
          uv run carla-reviewer-evidence freeze-split --help
          uv run carla-reviewer-evidence check-consumption --help
          uv run python -m carla_vision.imitation.runner --help
          uv run carla-source-snapshot --help
          uv run carla-audit-trajectories --help
          uv run carla-verify-shards --help
          uv run carla-pool-evaluations --help
          uv run carla-select-coreset --help
          uv run carla-score-diagnosis --help
          uv run carla-analyze-study-seeds --help
          uv run carla-replay-bundled-metrics --help
          uv run carla-reviewer-evidence init --output /tmp/reviewer-evidence/submission.template.json
          uv run python - <<'PYCODE'
          import json, subprocess, sys
          from pathlib import Path
          result = subprocess.run([sys.executable, '-m', 'carla_vision.reproduction.reviewer', 'check', '/tmp/reviewer-evidence/submission.template.json'], capture_output=True, text=True)
          assert result.returncode == 1, result.stderr
          payload = json.loads(result.stdout)
          assert payload['ready'] is False and payload['empirical_submission_ready'] is False
          assert payload['acceptance_guaranteed'] is False and payload['missing']
          Path('/tmp/reviewer-evidence/missing-evidence-check.json').write_text(result.stdout)
          PYCODE
      - name: Retain reviewer source and readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-evidence-${{ github.sha }}
          path: /tmp/reviewer-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Retain test results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-tests-${{ github.sha }}
          path: |
            /tmp/research-tests.xml
            /tmp/consumption-ci/
          retention-days: 14
          if-no-files-found: warn

  offline-tooling:
    name: Pinned offline tooling (CPython 3.13 Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download only the small tools needed by an offline reviewer
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/research-tooling ruff==0.16.0 pycocotools==2.0.11
          cd /tmp/research-tooling && sha256sum *.whl > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: research-offline-tooling-cp313-linux
          path: /tmp/research-tooling/
          retention-days: 7
          if-no-files-found: error
