name: Issue 28 implementation

on:
  push:
    branches: [issue/28-world-route-truth]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue/28-world-route-truth
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Relax patch diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/issue28_apply.py')
          s = p.read_text()
          old = '    if text.count(old) != 1:\n        raise RuntimeError(f"{path}: expected exactly one match, found {text.count(old)} for {old[:80]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")'
          new = '    count = text.count(old)\n    if count == 0:\n        print(f"SKIP {path}: {old[:80]!r}")\n        return\n    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one match, found {count} for {old[:80]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")'
          if old not in s:
              raise SystemExit('patch driver diagnostic hook changed')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply issue 28 patch
        run: |
          python tools/issue28_apply.py
          python tools/issue28_fix_current.py
      - name: Install Python dependencies
        run: uv sync --group dev --frozen
      - name: Validate Python changes
        run: |
          uv run ruff check carla_vision tests
          uv run pytest -q \
            tests/test_world_worker.py \
            tests/test_world_worker_client.py \
            tests/test_drive_console.py \
            tests/test_operator_configuration.py \
            tests/test_garage_preview.py \
            tests/test_garage_drive.py \
            tests/test_garage_world_route_ui.py
      - name: Validate and build Svelte console
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add carla_vision tests web
          git diff --cached --quiet && exit 0
          git commit -m "Implement exact Garage start and route selection"
          git push origin HEAD:issue/28-world-route-truth
