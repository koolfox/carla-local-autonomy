name: Dense progress review fix

on:
  push:
    branches: [issue/47-56-dense-progress]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue/47-56-dense-progress
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Apply review fix
        run: python .github/dense_progress_review_fix.py
      - name: Validate and build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check
          npm run build
      - name: Commit review fix and generated console
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/lib/domain/garagePreview.ts web/tests/garage-preview.test.mjs carla_vision/operator/console_static
          git diff --cached --quiet && exit 0
          git commit -m "Handle missing Garage progress values correctly"
          git push origin HEAD:issue/47-56-dense-progress
