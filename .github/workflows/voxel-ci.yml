name: Camera voxel CI

on:
  pull_request:
    paths:
      - "carla_vision/voxel/**"
      - "tests/test_voxel_*.py"
      - "docs/camera_voxel_world_fa.md"
      - "pyproject.toml"
      - ".github/workflows/voxel-ci.yml"
  push:
    branches: [main]
    paths:
      - "carla_vision/voxel/**"
      - "tests/test_voxel_*.py"
      - "pyproject.toml"
      - ".github/workflows/voxel-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-groups --frozen

      - name: Lint voxel modules
        run: >-
          uv run ruff check
          carla_vision/voxel
          tests/test_voxel_geometry.py
          tests/test_voxel_planner.py
          tests/test_voxel_capture.py

      - name: Run voxel tests
        run: >-
          uv run pytest -q
          tests/test_voxel_geometry.py
          tests/test_voxel_planner.py
          tests/test_voxel_capture.py

      - name: Check voxel dry run
        run: >-
          uv run carla-voxel-test
          --dry-run
          --frames 5
          --voxel-resolution 1.0
          --forecast-horizons 0,1,2
