name: Validate and publish consumed-sample source once
on:
  push:
    branches: [codex/144-consumed-samples]
    paths: [.github/consumption_transport/**, .github/workflows/consumption-apply-once.yml]
permissions:
  contents: write
jobs:
  validate-source:
    if: github.repository == 'koolfox/carla-local-autonomy' && github.ref == 'refs/heads/codex/144-consumed-samples'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Verify and apply the exact reviewed source
        shell: bash
        run: |
          mkdir -p /tmp/consumption-source
          cp -r .github/consumption_transport /tmp/consumption-source/
          git rev-parse HEAD > /tmp/consumption-source/transport-commit.txt
          git merge-base --is-ancestor 5e54af837ec67bc101ecd7a80866f1af8dff1ddf HEAD
          git diff --exit-code 5e54af837ec67bc101ecd7a80866f1af8dff1ddf HEAD -- carla_vision tests docs configs pyproject.toml uv.lock .github/workflows/research-offline.yml
          python - <<'PY'
          import base64, bz2, hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          root = Path('.github/consumption_transport')
          text = ''.join((root / f'payload.{i}').read_text(encoding='ascii') for i in range(3))
          if len(text) != 38556:
              raise SystemExit('wrong transport length')
          compressed = base64.b64decode(text, validate=True)
          if len(compressed) != 28916 or hashlib.sha256(compressed).hexdigest() != '2a0c63f97bf6a950c695f62aaa75602bed4b76731b1fe277f4879bf0192d7348':
              raise SystemExit('wrong compressed patch digest')
          patch = bz2.decompress(compressed)
          if len(patch) != 138948 or hashlib.sha256(patch).hexdigest() != '3ffa204c80ae9924a0acb13c4d35e9b32bfc2fd34b65624d98b497e64ec55826':
              raise SystemExit('wrong reviewed source patch digest')
          path = Path('/tmp/consumption-source/reviewed.patch')
          path.write_bytes(patch)
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True)
          changed = []
          for line in stats.splitlines():
              added, removed, filename = line.split('\t', 2)
              p = PurePosixPath(filename)
              if added == '-' or removed == '-' or p.is_absolute() or '..' in p.parts:
                  raise SystemExit('unsafe or binary patch')
              allowed = filename.startswith(('carla_vision/evaluation/', 'carla_vision/imitation/', 'carla_vision/training/', 'carla_vision/reproduction/', 'tests/', 'docs/')) or filename in {'configs/reviewer/model_card.template.json', '.github/workflows/research-offline.yml'}
              if not allowed:
                  raise SystemExit(f'out of scope source: {filename}')
              changed.append(filename)
          if len(changed) != 22 or len(set(changed)) != 22:
              raise SystemExit('expected 22 reviewed source paths')
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          fingerprints = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in changed}
          Path('/tmp/consumption-source/changed-file-sha256.json').write_text(json.dumps(fingerprints, indent=2) + '\n')
          print('Verified and applied all 22 source paths; no simulator executed.')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install all locked profiles without starting CARLA
        run: uv sync --all-extras --all-groups --frozen
      - name: Install offline recording encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint and validate whitespace
        run: |
          uv run ruff check carla_vision tests restore_project.py
          git diff --cached --check
      - name: Complete offline regression suite
        run: uv run pytest -q --junitxml=/tmp/consumption-source/tests.xml
      - name: Publish tested source only on this feature branch
        env:
          SOURCE_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          branch = 'codex/144-consumed-samples'
          if os.environ['GITHUB_REF'] != f'refs/heads/{branch}':
              raise SystemExit('unexpected branch')
          token = os.environ.pop('SOURCE_PUSH_TOKEN')
          auth_env = dict(os.environ, GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(f'x-access-token:{token}'.encode()).decode())
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', f'refs/heads/{branch}'], env=auth_env, text=True).split()[0]
          if remote != os.environ['GITHUB_SHA']:
              raise SystemExit('branch moved during tests; refusing publication')
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          commit_env = dict(os.environ, GIT_AUTHOR_NAME='Codex', GIT_AUTHOR_EMAIL='codex@openai.com', GIT_COMMITTER_NAME='Hesam Shani', GIT_COMMITTER_EMAIL='50404883+koolfox@users.noreply.github.com')
          message = 'feat(research): attest samples consumed by producers and bind test evidence to source\n\nAdvance S2 of #144 with fixed-pass observed receipts, fail-closed evaluation coverage, imitation loop instrumentation and source-bound pytest evidence. Opaque third-party trainers remain unaudited; no empirical ADAS claim.\n\nCo-authored-by: Hesam Sheini <50404883+koolfox@users.noreply.github.com>'
          subprocess.run(['git', 'commit', '-m', message], env=commit_env, check=True)
          subprocess.run(['git', 'push', 'origin', f'HEAD:refs/heads/{branch}'], env=auth_env, check=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True)
          Path('/tmp/consumption-source/published-commit.txt').write_text(sha)
          print('Published tested source:', sha.strip())
          PY
      - name: Retain exact source and tests even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumed-source-tests-${{ github.sha }}
          path: /tmp/consumption-source/
          retention-days: 14
          if-no-files-found: error
