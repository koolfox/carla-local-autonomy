name: Pinned consumption review tooling
on:
  push:
    branches: ['codex/144-ultralytics-consumption']
    paths: ['.github/workflows/consumption-review-tooling.yml']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download pinned table runtime for actual framework tests
        run: |
          mkdir -p /tmp/consumption-wheels
          python -m pip download --no-deps --only-binary=:all: -d /tmp/consumption-wheels polars==1.43.2 polars-runtime-32==1.43.2
          cd /tmp/consumption-wheels && sha256sum *.whl > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-consumption-table-runtime
          path: /tmp/consumption-wheels
          retention-days: 7
          if-no-files-found: error
