name: Pinned consumption review tooling
on:
  push:
    branches: ['codex/144-ultralytics-consumption']
    paths: ['.github/workflows/consumption-review-tooling.yml']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download only pinned framework and small support wheels
        run: |
          mkdir -p /tmp/consumption-wheels
          python -m pip download --no-deps --only-binary=:all: -d /tmp/consumption-wheels ultralytics==8.4.137 ultralytics-thop==2.1.6 ultralytics-platform==0.1.21
          cd /tmp/consumption-wheels && sha256sum *.whl > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-consumption-framework
          path: /tmp/consumption-wheels
          retention-days: 7
          if-no-files-found: error
