name: Behavior teacher CI

on:
  pull_request:
    paths:
      - "carla_vision/native/behavior_teacher.py"
      - "carla_vision/native/teacher_routes.py"
      - "carla_vision/native/teacher_verify.py"
      - "carla_vision/native/teacher_compare.py"
      - "tests/test_teacher_routes.py"
      - "tests/test_teacher_episode_verify.py"
      - "tests/test_teacher_compare.py"
      - "docs/behavior_teacher_episodes_fa.md"
      - "pyproject.toml"
      - ".github/workflows/behavior-teacher-ci.yml"
  push:
    branches: [main]
    paths:
      - "carla_vision/native/behavior_teacher.py"
      - "carla_vision/native/teacher_routes.py"
      - "carla_vision/native/teacher_verify.py"
      - "carla_vision/native/teacher_compare.py"
      - "tests/test_teacher_routes.py"
      - "tests/test_teacher_episode_verify.py"
      - "tests/test_teacher_compare.py"
      - "pyproject.toml"
      - ".github/workflows/behavior-teacher-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-groups --frozen

      - name: Lint BehaviorAgent teacher modules
        run: >-
          uv run ruff check
          carla_vision/native/behavior_teacher.py
          carla_vision/native/teacher_routes.py
          carla_vision/native/teacher_verify.py
          carla_vision/native/teacher_compare.py
          tests/test_teacher_routes.py
          tests/test_teacher_episode_verify.py
          tests/test_teacher_compare.py

      - name: Run BehaviorAgent teacher tests
        run: >-
          uv run pytest -q
          tests/test_teacher_routes.py
          tests/test_teacher_episode_verify.py
          tests/test_teacher_compare.py

      - name: Check collector CLI without CARLA
        run: uv run carla-record-behavior-teacher --help

      - name: Check verifier CLI
        run: uv run carla-verify-teacher-episodes --help

      - name: Check deterministic comparison CLI
        run: uv run carla-compare-teacher-episodes --help
