name: Dense cancellation and matrix

on:
  push:
    branches: [issue/47-56-dense-progress]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue/47-56-dense-progress
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - name: Apply cancellation patch
        run: python .github/dense_cancel_apply.py
      - name: Install dependencies
        run: uv sync --group dev
      - name: Validate source and dense acceptance
        run: |
          uv run ruff check carla_vision tests
          uv run pytest -q \
            tests/test_prepare_cancellation.py \
            tests/test_garage_density_acceptance.py \
            tests/test_observable_world_worker.py \
            tests/test_garage_async.py \
            tests/test_garage_reconfigure.py \
            tests/test_world_worker_reconfigure.py \
            tests/test_world_worker_client.py
          uv run carla-garage-density-acceptance --help
      - name: Commit validated cancellation and matrix source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            carla_vision/native/world_worker.py \
            carla_vision/native/observable_world_worker.py \
            carla_vision/operator/world_worker_client.py \
            carla_vision/operator/garage_preview.py \
            carla_vision/operator/garage_server.py \
            pyproject.toml \
            uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "Add bounded dense preparation cancellation and matrix gate"
          git push origin HEAD:issue/47-56-dense-progress
