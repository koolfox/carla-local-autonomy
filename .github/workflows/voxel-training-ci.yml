name: Temporal voxel training CI

on:
  pull_request:
    paths:
      - "carla_vision/voxel/training/**"
      - "carla_vision/voxel/model_examples/temporal_baseline.py"
      - "tests/test_voxel_training_*.py"
      - "tests/test_voxel_temporal_predictor.py"
      - "docs/voxel_training_fa.md"
      - "configs/voxel/temporal_baseline_smoke.json"
      - "pyproject.toml"
      - ".github/workflows/voxel-training-ci.yml"
  push:
    branches: [main]
    paths:
      - "carla_vision/voxel/training/**"
      - "carla_vision/voxel/model_examples/temporal_baseline.py"
      - "tests/test_voxel_training_*.py"
      - "tests/test_voxel_temporal_predictor.py"
      - "pyproject.toml"
      - ".github/workflows/voxel-training-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-groups --frozen

      - name: Lint temporal voxel modules
        run: >-
          uv run ruff check
          carla_vision/voxel/training
          carla_vision/voxel/model_examples/temporal_baseline.py
          tests/test_voxel_training_dataset.py
          tests/test_voxel_training_model.py
          tests/test_voxel_temporal_predictor.py
          tests/test_voxel_training_runner.py

      - name: Run temporal voxel tests
        run: >-
          uv run pytest -q
          tests/test_voxel_training_dataset.py
          tests/test_voxel_training_model.py
          tests/test_voxel_temporal_predictor.py
          tests/test_voxel_training_runner.py

      - name: Check synthetic training dry run
        run: >-
          uv run carla-train-voxel
          --dry-run
          --device cpu
          --history-frames 2
          --horizons 0,1
          --image-size 48x64
          --encoder-channels 32
          --recurrent-channels 48
          --seed-channels 32
          --decoder-channels 16
