name: Issue 69 console build

on:
  push:
    branches: [issue/69-runtime-navigation-ui]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'Rebuild console for NavigationIntent UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue/69-runtime-navigation-ui
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install and validate frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Commit generated console
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add carla_vision/operator/console_static
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rebuild console for NavigationIntent UI'
          git push origin HEAD:issue/69-runtime-navigation-ui
