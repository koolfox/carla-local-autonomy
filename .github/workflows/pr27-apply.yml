name: Apply and validate PR27

on:
  push:
    branches: [issue/27-live-garage-acceptance]

permissions:
  contents: write

concurrency:
  group: pr27-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message != 'Implement repeatable live Garage acceptance gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue/27-live-garage-acceptance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install lean development profile
        run: uv sync --group dev
      - name: Apply reviewed source patch
        run: |
          python .github/pr27_apply.py
          # GitHub Actions tokens cannot push workflow-file changes. The same
          # lean-CI additions are applied with the GitHub connector after this
          # validated source commit lands.
          git checkout -- .github/workflows/ci.yml
      - name: Lint changed Python
        run: |
          uv run ruff check \
            carla_vision/native/world_worker.py \
            carla_vision/operator/world_worker_client.py \
            carla_vision/operator/garage_acceptance.py \
            tests/test_camera_pause_acceptance.py \
            tests/test_garage_acceptance.py
      - name: Run focused lifecycle regressions
        run: |
          uv run pytest -q \
            tests/test_camera_pause_acceptance.py \
            tests/test_garage_acceptance.py \
            tests/test_world_worker.py \
            tests/test_world_worker_client.py \
            tests/test_world_worker_stream_lifecycle.py \
            tests/test_garage_drive.py \
            tests/test_drive_console.py
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            carla_vision/native/world_worker.py \
            carla_vision/operator/world_worker_client.py \
            carla_vision/operator/garage_acceptance.py \
            pyproject.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Implement repeatable live Garage acceptance gate'
          git push origin HEAD:issue/27-live-garage-acceptance
